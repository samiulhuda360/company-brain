[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "company-brain"
version = "1.0.0"
description = "A local knowledge graph of a company's documents, CRM, orders, tickets and org chart, queried by AI assistants over MCP with cited answers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Samiul Huda" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "mcp>=2.3,<3",
  "pypdf>=5",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17", "mypy>=1.10"]

[project.scripts]
brain = "company_brain.cli:main"

[tool.setuptools]
packages = ["company_brain", "company_brain.sample"]

[tool.setuptools.package-data]
company_brain = ["static/*"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"company_brain/sample/generate.py" = ["E501"]
"eval/*.py" = ["E501"]
"tests/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["company_brain", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
